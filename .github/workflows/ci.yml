name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and test (${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: GCC
          - os: windows-latest
            compiler: MSVC

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Qt 6 (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: windows
          target: desktop
          arch: win64_msvc2022_64

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libgl1-mesa-dev ninja-build

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Verify GIF output with an external decoder (Linux)
        if: runner.os == 'Linux'
        run: |
          pip install pillow
          python3 .github/scripts/verify_gif.py build/it-pixel-cli

  static-analysis:
    name: Static analysis (clang-tidy)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libgl1-mesa-dev ninja-build clang-tidy

      - name: Configure (Debug, with compile database)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run clang-tidy
        run: |
          clang-tidy -p build \
            src/core/MosaicEngine.cpp \
            src/core/GifExporter.cpp \
            src/core/Paths.cpp \
            src/cli/main.cpp \
            src/cli/CliOptions.cpp \
            src/gui/MainWindow.cpp \
            src/gui/EngineWorker.cpp \
            src/gui/main.cpp \
            src/gui/Theme.cpp
